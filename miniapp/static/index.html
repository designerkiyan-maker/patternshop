<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>{{STORE_NAME}}</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v={{VERSION}}">
</head>
<body>
<div id="app">
  <div class="grid-fx" aria-hidden="true"></div>

  <header class="topbar {{HEADER_LOGO_CLASS}}">
    <button class="wallet-chip" id="header-wallet-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6" width="17" height="12.5" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14.2" r="1.3" fill="currentColor"/></svg>
      <span id="header-wallet-amount">۰ تومان</span>
    </button>
    <div class="topbar-brand">
      <span class="brand">{{STORE_NAME}}</span>
      <span class="brand-avatar">{{HEADER_LOGO_HTML}}<span class="brand-avatar-fallback" aria-hidden="true">🤖</span></span>
    </div>
  </header>

  <main id="content"></main>

  <nav id="tabbar">
    <button data-tab="home" class="active">
      <svg class="ic-outline" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 11h2v9h6v-6h2v6h6v-9h2L12 3.2Z"/></svg>
      <span>خانه</span>
    </button>
    <button data-tab="store">
      <svg class="ic-outline" viewBox="0 0 24 24" fill="none"><path d="M4 8h16l-1.2 10.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 8V6a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ic-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6a4 4 0 1 1 8 0v1.2h2.4a1 1 0 0 1 1 .9l1.1 10.3a2.4 2.4 0 0 1-2.4 2.6H7.9a2.4 2.4 0 0 1-2.4-2.6L6.6 8.1a1 1 0 0 1 1-.9H10V6Zm2 1.2h4V6a2 2 0 0 0-4 0v1.2Z"/></svg>
      <span>فروشگاه</span>
    </button>
    <button data-tab="services">
      <svg class="ic-outline" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12.2 11.3 14l3.2-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.3 3.4 5.2v6.4c0 5.5 3.7 9.9 8.6 11.5 4.9-1.6 8.6-6 8.6-11.5V5.2L12 1.3Zm-.9 14.4-3.3-3.3 1.4-1.4 1.9 1.9 4.6-4.6 1.4 1.4-6 6Z"/></svg>
      <span>سرویس‌ها</span>
    </button>
    <button data-tab="profile">
      <svg class="ic-outline" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 19.5c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ic-filled" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.8" r="3.8"/><path d="M12 12.6c-4.4 0-8 2.9-8 7.4 0 .6.4 1 1 1h14c.6 0 1-.4 1-1 0-4.5-3.6-7.4-8-7.4Z"/></svg>
      <span>پروفایل</span>
    </button>
    <button data-tab="admin" id="admin-tab-btn" style="display:none">
      <svg class="ic-outline" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12.2 11.3 14l3.2-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.3 3.4 5.2v6.4c0 5.5 3.7 9.9 8.6 11.5 4.9-1.6 8.6-6 8.6-11.5V5.2L12 1.3Zm-.9 14.4-3.3-3.3 1.4-1.4 1.9 1.9 4.6-4.6 1.4 1.4-6 6Z"/></svg>
      <span>مدیریت</span>
    </button>
  </nav>
</div>
<script src="app.js?v={{VERSION}}"></script>
</body>
</html>
