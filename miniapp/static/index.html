<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فروشگاه کانفیگ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="grid-fx" aria-hidden="true"></div>

  <header>
    <div class="header-inner">
      <div class="signal" aria-hidden="true">
        <span class="signal-ring signal-ring--2"></span>
        <span class="signal-ring"></span>
        <span class="signal-dot"></span>
      </div>
      <div class="header-text">
        <h1 id="greeting">در حال بارگذاری...</h1>
        <p class="header-sub">اتصال امن و پایدار</p>
      </div>
    </div>
  </header>

  <main id="content"></main>

  <nav id="tabbar">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>خانه</span>
    </button>
    <button data-tab="store">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16l-1.2 10.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 8V6a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>فروشگاه</span>
    </button>
    <button data-tab="wheel">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4.5" width="16" height="15" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16" stroke="currentColor" stroke-width="1.8"/><circle cx="8.3" cy="14" r="1.15" fill="currentColor"/><circle cx="12" cy="14" r="1.15" fill="currentColor"/><circle cx="15.7" cy="14" r="1.15" fill="currentColor"/></svg>
      <span>جکپات</span>
    </button>
    <button data-tab="wallet">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6" width="17" height="12.5" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14.2" r="1.3" fill="currentColor"/></svg>
      <span>کیف پول</span>
    </button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
