<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<!-- ضدکش: بعضی وب‌ویوها به هدر HTTP توجه نمی‌کنند؛ این متاتگ‌ها با هر باز شدن نسخه‌ی تازه می‌گیرند -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>فروشگاه الگوی خیاطی</title>
<meta name="description" content="فروشگاه الگوی خیاطی — خرید و دانلود الگوهای خیاطی">
<script src="https://telegram.org/js/telegram-web-app.js?v=cart-menu-1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v={{VERSION}}">
</head>
<body>
<div id="app">
  <div class="grid-fx" aria-hidden="true"></div>

  <header class="topbar {{HEADER_LOGO_CLASS}}">
    <button class="wallet-chip" id="header-wallet-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6" width="17" height="12.5" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14.2" r="1.3" fill="currentColor"/></svg>
      <span id="header-wallet-amount">۰ تومان</span>
    </button>
    <div class="topbar-brand">
      <span class="brand">{{STORE_NAME}}</span>
      <span class="brand-avatar">{{HEADER_LOGO_HTML}}<span class="brand-avatar-fallback" aria-hidden="true">🧵</span></span>
    </div>
  </header>

  <main id="content"></main>

  <nav id="tabbar">
    <button data-tab="home" class="active">
      <span class="tab-ic" style="--ic:url('icons/home.svg')"></span>
      <span>خانه</span>
    </button>
    <button data-tab="store">
      <span class="tab-ic" style="--ic:url('icons/shop.svg')"></span>
      <span>فروشگاه</span>
    </button>
    <button data-tab="wishlist">
      <span class="tab-ic" style="--ic:url('icons/heart.svg')"></span>
      <span>پسندیده‌ها</span>
    </button>
    <button data-tab="services">
      <span class="tab-ic" style="--ic:url('icons/orders.svg')"></span>
      <span>سفارش‌ها</span>
    </button>
    <button data-tab="cart" type="button">
      <span class="tab-ic" style="--ic:url('icons/cart.svg')"></span>
      <span>سبد خرید</span>
      <span id="bottom-cart-count" class="tab-badge" style="display:none">0</span>
    </button>
    <button data-tab="profile">
      <span class="tab-ic" style="--ic:url('icons/user.svg')"></span>
      <span>پروفایل</span>
    </button>
  </nav>
</div>
<script src="app.js?v={{VERSION}}"></script>
</body>
</html>
